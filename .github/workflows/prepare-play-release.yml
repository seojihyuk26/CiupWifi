name: Prepare Play Release v1.4.0

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Write reviewed release files, commit, tag, and start release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          write_payload() {
            local destination="$1"
            mkdir -p "$(dirname "$destination")"
            base64 --decode > "$destination"
          }

