      - name: Apply reviewed files, commit, tag, and start release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base64 --decode /tmp/play-release-payload.b64 > /tmp/play-release-payload.zip
          test "$(unzip -Z1 /tmp/play-release-payload.zip | wc -l)" -eq 18
          unzip -q /tmp/play-release-payload.zip -d .
          python3 -m py_compile scripts/apply_android_overlay.py
          python3 -m json.tool package.json > /dev/null
          python3 -m json.tool package-lock.json > /dev/null
          python3 -m json.tool src-tauri/tauri.conf.json > /dev/null
          rm -rf scripts/__pycache__
          git rm --quiet .github/workflows/prepare-play-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "chore: prepare Google Play release v1.4.0"
          git push origin HEAD:main
          git tag -a v1.4.0 -m "CiupWifi v1.4.0"
          git push origin refs/tags/v1.4.0
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/release.yml/dispatches" \
            -d '{"ref":"v1.4.0"}'
