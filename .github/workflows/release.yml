name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Desktop (Windows + macOS) ──────────────────────────────────────────────
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Build and Release Desktop
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CiupWifi ${{ github.ref_name }}'
          releaseBody: |
            ### 📶 CiupWifi Release ${{ github.ref_name }}
            Auto-login and session renewal app for CIUP Campus "WifiCity" network.

            #### 📦 Downloads & Instructions:
            - **Windows**: `CiupWifi_*_x64-setup.exe` (SmartScreen: More Info -> Run Anyway)
            - **macOS**: `CiupWifi_*_universal.dmg` (If blocked: Run `xattr -cr /Applications/CiupWifi.app` in Terminal or open System Settings -> Privacy & Security -> Open Anyway)
            - **Android**: `CiupWifi.apk`
            - **iOS / iPadOS**: [Greasy Fork Userscript](https://greasyfork.org/fr/scripts/488569-cite-university-wifi-auto-login-script)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # ── Android (APK) ──────────────────────────────────────────────────────────
  build-android:
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK & NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" "build-tools;34.0.0" "platforms;android-34"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Setup Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install npm dependencies
        run: npm ci

      - name: Init Tauri Android project
        run: npx tauri android init --ci

      - name: Apply Custom App Icons to Android
        run: cp -rf src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/

      - name: Build Android APK
        run: npx tauri android build --apk

      - name: Sign APK
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias ciupwifi -keyalg RSA -keysize 2048 -validity 10000 -storepass ciupwifipass -keypass ciupwifipass -dname "CN=CiupWifi, O=CIUP, C=FR"
          mkdir -p release-apks
          shopt -s globstar nullglob
          for apk in src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk; do
            if [ -f "$apk" ]; then
              $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:ciupwifipass --key-pass pass:ciupwifipass --out "release-apks/CiupWifi.apk" "$apk"
              break
            fi
          done
          ls -lh release-apks/

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/CiupWifi.apk
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Greasy Fork Sync
        if: env.GREASYFORK_WEBHOOK_URL != ''
        run: |
          echo "Triggering Greasy Fork userscript sync..."
          curl -s -X POST "${{ secrets.GREASYFORK_WEBHOOK_URL }}" || true
        env:
          GREASYFORK_WEBHOOK_URL: ${{ secrets.GREASYFORK_WEBHOOK_URL }}
