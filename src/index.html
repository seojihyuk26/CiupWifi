<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CiupWifi</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- ── Status Card (Connected) ── -->
    <div class="card" id="card-status" style="display:none">
      <div class="icon">✅</div>
      <h1>WifiCity Connected</h1>
      <p class="sub">Internet access is active.</p>
      <div class="stat">🕒 Status: <strong id="status-time">Online</strong></div>
      <div class="stat">👤 Account: <strong id="current-user">—</strong></div>
      <button class="btn-primary" id="btn-recheck" style="margin-top:16px">Check Connection</button>
      <button class="btn-secondary" id="btn-logout" style="margin-top:8px">Change Account</button>
    </div>

    <!-- ── Login Card ── -->
    <div class="card" id="card-login">
      <div class="icon">📶</div>
      <h1>WifiCity Login</h1>
      <p class="sub">CIUP Wi-Fi login & reconnect</p>

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="your_username" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <div id="status-msg" class="status-msg" style="display:none"></div>

      <button class="btn-primary" id="btn-login">Connect</button>

      <p class="hint">For WifiCity (CIUP campus network). Unofficial app.</p>
    </div>
  </div>

  <script src="main.js" type="module"></script>
</body>
</html>
