<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>CiupWifi</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ambient-glow"></div>

  <div id="app">
    <!-- ── Update Notification Banner ── -->
    <div id="update-banner" class="update-banner" style="display:none">
      <div class="update-info">
        <span class="sparkle">✨</span>
        <span id="update-text">Update available</span>
      </div>
      <button class="btn-update" id="btn-update">Update</button>
    </div>

    <!-- ── Status Card (Connected) ── -->
    <div class="card" id="card-status" style="display:none">
      <div class="status-indicator">
        <div class="pulse-ring"></div>
        <div class="status-dot"></div>
      </div>

      <h1 class="brand-title">Connected</h1>
      <p class="brand-sub">Cité Universitaire • WifiCity</p>

      <div class="info-group">
        <div class="info-row">
          <span class="label">Network</span>
          <span class="value online" id="status-time">Online</span>
        </div>
        <div class="info-row">
          <span class="label">Account</span>
          <span class="value" id="current-user">—</span>
        </div>
        <div class="info-row">
          <span class="label">Auto-Renewal</span>
          <span class="value text-emerald">⚡ Active (OS Task)</span>
        </div>
      </div>

      <p class="hint-dismiss">You can safely close this window.<br/>Background renewal runs silently.</p>

      <div class="action-stack">
        <button class="btn-primary" id="btn-recheck">Check Connection</button>
        <button class="btn-ghost" id="btn-logout">Change Account</button>
      </div>
    </div>

    <!-- ── Login Card ── -->
    <div class="card" id="card-login">
      <div class="logo-badge">
        <svg class="wifi-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
          <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <circle cx="12" cy="20" r="1.5" fill="currentColor"></circle>
        </svg>
      </div>

      <h1 class="brand-title">CiupWifi</h1>
      <p class="brand-sub">Auto-login for CIUP Campus Network</p>

      <div class="form-container">
        <div class="field">
          <label for="username">Username</label>
          <div class="input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="text" id="username" placeholder="Campus ID" autocomplete="username" spellcheck="false" />
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
          </div>
        </div>

        <div id="status-msg" class="status-msg" style="display:none"></div>

        <button class="btn-primary" id="btn-login">Connect</button>
      </div>

      <p class="footer-meta">WifiCity Gateway (10.254.0.254)</p>
    </div>
  </div>

  <script src="main.js" type="module"></script>
</body>
</html>
